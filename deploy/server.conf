# WEVE public server configuration (WEVE-25).
# Use with: luanti --server --config deploy/server.conf --gameid weve --world <world dir>
# (on Ubuntu the binary is minetestserver or luantiserver, same options).

# Network
port = 30000
server_name = WEVE - Western Engineering Virtual Explorer (SE3351 Team 50)
server_description = Block-based tour of TEB, SEB and ACEB. Any name, no password.
server_announce = false

# Visitors join with any name and no password and get only interact and shout (README, TC-13).
disallow_empty_password = false
default_privs = interact, shout
enable_damage = false
creative_mode = false

# Privacy (NFR-04, D-21): keep player names and IP addresses out of debug.txt.
# "warning" drops the ACTION lines, which include "<name> [<ip>] joins game".
debug_log_level = warning
